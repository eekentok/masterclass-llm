<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İş Bankası AI Asistanı</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container two-column-layout">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-university"></i>
                    <h1>İş Bankası AI Asistanı</h1>
                </div>
                <div class="header-controls">
                    <div class="model-selector">
                        <label for="modelSelect">Model:</label>
                        <select id="modelSelect" class="model-dropdown">
                            <option value="llama3-70b-8192">Llama 3 70B (Daha kısa cevaplar)</option>
                            <option value="Qwen/Qwen3-32B">Qwen 3 (Daha uzun cevaplar)</option>
                        </select>
                    </div>
                    <div class="status-indicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-text" id="statusText">Bağlanıyor...</span>
                    </div>
                </div>
            </div>
        </header>
        <div class="main-content">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- Welcome message -->
                    <div class="message bot-message">
                        <div class="message-avatar">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-text">
                                Merhaba! Ben İş Bankası AI Asistanınız. Bankacılık ürünleri, hizmetler ve işlemler hakkında sorularınızı yanıtlamaya hazırım. Size nasıl yardımcı olabilirim?
                            </div>
                            <div class="message-time" id="welcomeTime"></div>
                        </div>
                    </div>
                </div>
                <div class="loading-text" id="loadingText" style="display:none;">Yanıt hazırlanıyor...</div>
                <!-- Input Area -->
                <div class="chat-input-container">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            placeholder="Mesajınızı yazın..." 
                            rows="1"
                            maxlength="1000"
                        ></textarea>
                        <button id="sendButton" class="send-button" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="char-count" id="charCount">0/1000</span>
                        <button id="clearChat" class="clear-button">
                            <i class="fas fa-trash"></i> Sohbeti Temizle
                        </button>
                    </div>
                </div>
            </div>
            <div class="quick-actions">
                <h3>Hızlı Sorular</h3>
                <div class="quick-buttons">
                    <button class="quick-btn" data-question="Vadeli mevduat nedir?">
                        <i class="fas fa-piggy-bank"></i>
                        Vadeli Mevduat
                    </button>
                    <button class="quick-btn" data-question="Vadeli hesap nasıl açılır?">
                        <i class="fas fa-plus-circle"></i>
                        Hesap Açma
                    </button>
                    <button class="quick-btn" data-question="Vadeli ve vadesiz hesap arasındaki fark nedir?">
                        <i class="fas fa-balance-scale"></i>
                        Hesap Türleri
                    </button>
                    <button class="quick-btn" data-question="Faiz oranları nasıl belirlenir?">
                        <i class="fas fa-percentage"></i>
                        Faiz Oranları
                    </button>
                    <button class="quick-btn" data-question="Mevduat sigortası nedir?">
                        <i class="fas fa-shield-alt"></i>
                        Mevduat Sigortası
                    </button>
                    <button class="quick-btn" data-question="Stopaj ne demek?">
                        <i class="fas fa-calculator"></i>
                        Stopaj
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
